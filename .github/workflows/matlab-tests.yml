name: MATLAB tests

on:
  push:
    branches:
      - agent/fccore-tdd-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: MATLAB unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          cache: true

      - name: Run test suite
        uses: matlab-actions/run-tests@v3
        with:
          source-folder: .
          select-by-folder: tests/unit
          strict: true
          output-detail: concise
          test-results-junit: artifacts/test-results/results.xml
          test-results-html: artifacts/test-results/html
          code-coverage-cobertura: artifacts/coverage/coverage.xml
          code-coverage-html: artifacts/coverage/html

      - name: Upload MATLAB reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-test-reports
          path: artifacts
          if-no-files-found: warn
